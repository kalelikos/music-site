<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kalel mus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080c;
      --glass: rgba(18, 20, 29, 0.45);
      --glass-hover: rgba(26, 29, 42, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-focus: rgba(168, 85, 247, 0.4);
      --accent: #a855f7;
      --accent-gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      --accent-glow: rgba(168, 85, 247, 0.35);
      --text: #ffffff;
      --text-dim: #94a3b8;
      --danger: #ff4565;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: 40px 16px;
    }

    /* Анимированные сферы на фоне */
    .ambient-glow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      animation: float 14s infinite ease-in-out alternate;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: #7c3aed;
      top: -60px;
      left: 10%;
      animation-duration: 16s;
    }

    .orb-2 {
      width: 380px;
      height: 380px;
      background: #3b82f6;
      top: 45%;
      right: 5%;
      animation-duration: 20s;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 340px;
      height: 340px;
      background: #ec4899;
      bottom: -40px;
      left: 20%;
      animation-duration: 18s;
      animation-delay: -8s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 35px) scale(1.12); }
      100% { transform: translate(-30px, 70px) scale(0.95); }
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      animation: pageIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Шапка сайта */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding: 16px 24px;
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-glow {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Стекло (Glass card) */
    .glass-box {
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    .glass-box:hover {
      border-color: rgba(255, 255, 255, 0.14);
    }

    /* Форма ввода */
    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 8px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      background: rgba(10, 11, 18, 0.55);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: #fff;
      padding: 14px 18px;
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
      margin-bottom: 12px;
    }

    textarea:focus, input:focus {
      border-color: var(--accent);
      background: rgba(10, 11, 18, 0.85);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* Кнопки */
    button {
      font-family: inherit;
      border-radius: 14px;
      padding: 12px 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
    }

    .btn-glow {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 26px rgba(168, 85, 247, 0.55);
      filter: brightness(1.08);
    }

    .btn-glass {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
    }

    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Статус */
    .status-text {
      font-size: 13px;
      margin-top: 10px;
      min-height: 20px;
      font-weight: 500;
      color: var(--text-dim);
    }

    /* Список треков */
    .tracks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 32px 6px 16px;
    }

    .tracks-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .badge-counter {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      color: var(--text-dim);
    }

    .track-item {
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 20px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: cardIn 0.5s ease;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .track-item:hover {
      background: var(--glass-hover);
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    .track-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .track-name {
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .btn-del {
      background: rgba(255, 69, 101, 0.1);
      color: var(--danger);
      border: 1px solid rgba(255, 69, 101, 0.25);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 12px;
      transition: 0.2s ease;
    }

    .btn-del:hover {
      background: var(--danger);
      color: #fff;
    }

    iframe {
      border: none;
      border-radius: 14px;
      width: 100%;
      display: block;
    }

    /* Модальное окно */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 8, 0.7);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.show { display: flex; }

    .modal-box {
      background: rgba(18, 20, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(30px);
      border-radius: 26px;
      max-width: 480px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      animation: modalZoom 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalZoom {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .empty-placeholder {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <!-- Задний неоновый фон -->
  <div class="ambient-glow">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="container">
    <!-- Шапка -->
    <header>
      <div class="brand">
        <div class="avatar-glow">🪐</div>
        <div>
          <h1 class="brand-title">kalel mus</h1>
          <div class="brand-status">
            <span class="status-dot"></span>
            online playlist
          </div>
        </div>
      </div>
      <button class="btn-glass" onclick="openModal()">⚙️ GitHub</button>
    </header>

    <!-- Панель добавления трека -->
    <div class="glass-box">
      <label class="input-label">Добавить аудио или видео</label>
      <textarea id="embedInput" rows="2" placeholder="Вставь ссылку Spotify, YouTube или код <iframe>..."></textarea>
      <input type="text" id="trackTitle" placeholder="Название трека (необязательно)">
      <button class="btn-glow" style="width: 100%;" onclick="addTrack()">⚡ Добавить в плейлист</button>
      <div id="statusMsg" class="status-text"></div>
    </div>

    <!-- Список треков -->
    <div class="tracks-header">
      <span class="tracks-title">Треки</span>
      <span class="badge-counter" id="counter">0 треков</span>
    </div>

    <div id="tracksList"></div>
  </div>

  <!-- Окно настроек GitHub -->
  <div class="modal-backdrop" id="modalSettings">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3 style="font-size: 19px; font-weight: 600;">Настройки репозитория</h3>
        <button class="btn-glass" style="padding: 6px 12px;" onclick="closeModal()">✕</button>
      </div>
      <p style="font-size: 13px; color: var(--text-dim); margin-bottom: 18px;">
        Токен хранится локально в твоем браузере и обновляет tracks.json на GitHub.
      </p>
      <input type="text" id="ghRepo" placeholder="kalelikos/music-site">
      <input type="password" id="ghToken" placeholder="GitHub Token (PAT)">
      <div style="display: flex; gap: 10px; margin-top: 6px;">
        <button class="btn-glow" style="flex: 1;" onclick="saveSettings()">Сохранить</button>
        <button class="btn-glass" onclick="closeModal()">Отмена</button>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_FILE_PATH = 'tracks.json';
    let tracks = [];

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || 'kalelikos/music-site';
      document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
      await loadTracks();
    });

    function openModal() { document.getElementById('modalSettings').classList.add('show'); }
    function closeModal() { document.getElementById('modalSettings').classList.remove('show'); }

    function saveSettings() {
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      closeModal();
      showStatus('✅ Подключение сохранено!');
      loadTracks();
    }

    function showStatus(text, isError = false) {
      const el = document.getElementById('statusMsg');
      el.innerText = text;
      el.style.color = isError ? 'var(--danger)' : '#10b981';
    }

    // Загрузка треков без задержек (с кэшем и прямым запросом к GitHub API)
    async function loadTracks() {
      const cached = localStorage.getItem('local_tracks');
      if (cached) {
        try {
          tracks = JSON.parse(cached);
          renderTracks();
        } catch (e) {}
      }

      const repo = localStorage.getItem('gh_repo') || 'kalelikos/music-site';
      const token = localStorage.getItem('gh_token');

      try {
        const headers = { 'Accept': 'application/vnd.github.v3+json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${GITHUB_FILE_PATH}?t=${Date.now()}`, { headers });
        if (res.ok) {
          const fileData = await res.json();
          const decoded = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
          tracks = JSON.parse(decoded);
          localStorage.setItem('local_tracks', JSON.stringify(tracks));
          renderTracks();
          return;
        }
      } catch (e) {
        console.warn('API недоступен, пробуем файл...');
      }

      try {
        const res = await fetch(`./${GITHUB_FILE_PATH}?t=${Date.now()}`);
        if (res.ok) {
          tracks = await res.json();
          renderTracks();
        }
      } catch (e) {}
    }

    function renderTracks() {
      const container = document.getElementById('tracksList');
      const counter = document.getElementById('counter');
      counter.innerText = `${tracks.length} треков`;
      container.innerHTML = '';

      if (tracks.length === 0) {
        container.innerHTML = `
          <div class="empty-placeholder">
            <div style="font-size: 42px; margin-bottom: 12px; opacity: 0.6;">✨</div>
            <p>Плейлист пуст. Добавь любимый трек сверху!</p>
          </div>
        `;
        return;
      }

      tracks.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = 'track-item';
        card.innerHTML = `
          <div class="track-topbar">
            <span class="track-name">${track.title || 'Трек #' + (tracks.length - index)}</span>
            <button class="btn-del" onclick="deleteTrack(${index})">Удалить</button>
          </div>
          <iframe src="${track.url}" height="${track.height || '352'}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        `;
        container.appendChild(card);
      });
    }

    function parseMediaInput(input) {
      input = input.trim();
      if (input.includes('<iframe')) {
        const match = input.match(/src=["']([^"']+)["']/);
        return match ? match[1] : null;
      }
      if (input.includes('open.spotify.com/')) {
        return input.replace('open.spotify.com/', 'open.spotify.com/embed/');
      }
      if (input.includes('youtube.com/watch?v=')) {
        const id = new URL(input).searchParams.get('v');
        return `https://www.youtube.com/embed/${id}`;
      }
      if (input.includes('youtu.be/')) {
        const id = input.split('youtu.be/')[1]?.split('?')[0];
        return `https://www.youtube.com/embed/${id}`;
      }
      return input;
    }

    async function addTrack() {
      const input = document.getElementById('embedInput').value;
      const title = document.getElementById('trackTitle').value;
      const url = parseMediaInput(input);

      if (!url) {
        alert('Вставь корректную ссылку Spotify / YouTube или код iframe!');
        return;
      }

      const newTrack = {
        url: url,
        title: title || '',
        height: url.includes('spotify') ? '352' : (url.includes('youtube') ? '380' : '160')
      };

      tracks.unshift(newTrack);
      renderTracks();
      document.getElementById('embedInput').value = '';
      document.getElementById('trackTitle').value = '';

      await syncWithGitHub();
    }

    async function deleteTrack(index) {
      if (!confirm('Удалить этот трек?')) return;
      tracks.splice(index, 1);
      renderTracks();
      await syncWithGitHub();
    }

    async function syncWithGitHub() {
      const repo = localStorage.getItem('gh_repo') || 'kalelikos/music-site';
      const token = localStorage.getItem('gh_token');

      localStorage.setItem('local_tracks', JSON.stringify(tracks));

      if (!token) {
        showStatus('⚠️ Сохранено локально! Настрой GitHub для общего доступа.');
        return;
      }

      showStatus('⏳ Синхронизация с GitHub...');

      try {
        const apiUrl = `https://api.github.com/repos/${repo}/contents/${GITHUB_FILE_PATH}`;
        const headers = {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        };

        let sha = null;
        const getRes = await fetch(apiUrl + `?t=${Date.now()}`, { headers });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        }

        const jsonStr = JSON.stringify(tracks, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(jsonStr)));

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify({
            message: 'Update music list via kalel mus',
            content: base64Content,
            sha: sha || undefined
          })
        });

        if (putRes.ok) {
          showStatus('✅ Успешно сохранено на GitHub!');
        } else {
          const err = await putRes.json();
          showStatus('❌ Ошибка: ' + err.message, true);
        }
      } catch (e) {
        showStatus('❌ Ошибка сети: ' + e.message, true);
      }
    }
  </script>
</body>
</html>
