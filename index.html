<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kalel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b13;
      --card-bg: rgba(18, 28, 45, 0.45);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(56, 189, 248, 0.35);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --text: #ffffff;
      --text-muted: #8292a8;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding: 40px 24px;
    }

    /* Фоновые неоновые пятна точь-в-точь как на фото */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .glow-cyan {
      position: absolute;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.28) 0%, rgba(2, 132, 199, 0.12) 50%, transparent 75%);
      top: 15%;
      left: -80px;
      filter: blur(100px);
    }

    .glow-blue {
      position: absolute;
      width: 580px;
      height: 580px;
      background: radial-gradient(circle, rgba(30, 58, 138, 0.35) 0%, rgba(15, 23, 42, 0.1) 60%, transparent 80%);
      bottom: 10%;
      right: -100px;
      filter: blur(120px);
    }

    .glow-center {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(90px);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Шапка */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.8px;
      color: #ffffff;
    }

    /* Кнопки */
    button {
      font-family: inherit;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text-muted);
    }

    .btn-icon:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .btn-add {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .btn-add:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    .btn-add svg {
      stroke: var(--accent);
    }

    .status-badge {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Сетка карточек */
    .tracks-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      width: 100%;
    }

    @media (max-width: 820px) {
      .tracks-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Матовая карточка трека */
    .track-card {
      background: var(--card-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .track-card:hover {
      border-color: var(--card-border-hover);
      transform: translateY(-3px);
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.55), 0 0 24px rgba(56, 189, 248, 0.15);
    }

    .track-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .track-title {
      font-size: 14px;
      font-weight: 500;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }

    .btn-delete {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--danger);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    iframe {
      border: none;
      border-radius: 16px;
      width: 100%;
      display: block;
    }

    /* Модальные окна */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: rgba(18, 28, 45, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      animation: modalScale 0.2s ease;
    }

    @keyframes modalScale {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-close:hover {
      color: #fff;
    }

    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      background: rgba(10, 16, 26, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      padding: 14px;
      font-size: 14px;
      outline: none;
      margin-bottom: 14px;
      transition: all 0.2s ease;
    }

    textarea:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .btn-save {
      width: 100%;
      background: var(--accent);
      color: #041019;
      font-weight: 600;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
    }

    .btn-save:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 15px;
    }
  </style>
</head>
<body>

  <!-- Фон с мягким свечением -->
  <div class="ambient-glow">
    <div class="glow-cyan"></div>
    <div class="glow-blue"></div>
    <div class="glow-center"></div>
  </div>

  <div class="container">
    <!-- Шапка: Название слева, Настройки справа -->
    <header>
      <div class="logo">kalel</div>
      <button class="btn-icon" onclick="openModal('settingsModal')" title="Настройки">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Строка под шапкой: Кнопка добавить трек -->
    <div class="actions-bar">
      <button class="btn-add" onclick="openModal('addModal')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Добавить музыку
      </button>
      <div id="statusText" class="status-badge"></div>
    </div>

    <!-- Сетка треков -->
    <div class="tracks-grid" id="tracksGrid"></div>
  </div>

  <!-- Модальное окно: Добавление музыки -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">Добавить трек</div>
        <button class="btn-close" onclick="closeModal('addModal')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <textarea id="embedInput" rows="3" placeholder="Вставь ссылку Spotify, YouTube или код iframe..."></textarea>
      <input type="text" id="trackTitle" placeholder="Подпись или название (необязательно)">
      <button class="btn-save" onclick="addTrack()">Добавить</button>
    </div>
  </div>

  <!-- Модальное окно: Настройки GitHub -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">Настройки GitHub</div>
        <button class="btn-close" onclick="closeModal('settingsModal')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <input type="text" id="ghRepo" placeholder="kalelikos/music-site">
      <input type="password" id="ghToken" placeholder="GitHub Token (PAT)">
      <button class="btn-save" onclick="saveSettings()">Сохранить настройки</button>
    </div>
  </div>

  <script>
    const GITHUB_FILE_PATH = 'tracks.json';
    let tracks = [];

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || 'kalelikos/music-site';
      document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
      await loadTracks();
    });

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function setStatus(msg, isErr = false) {
      const el = document.getElementById('statusText');
      el.innerText = msg;
      el.style.color = isErr ? 'var(--danger)' : 'var(--accent)';
    }

    function saveSettings() {
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      closeModal('settingsModal');
      setStatus('Настройки сохранены');
      loadTracks();
    }

    async function loadTracks() {
      const cached = localStorage.getItem('local_tracks');
      if (cached) {
        try {
          tracks = JSON.parse(cached);
          renderTracks();
        } catch(e) {}
      }

      const repo = localStorage.getItem('gh_repo') || 'kalelikos/music-site';
      const token = localStorage.getItem('gh_token');

      try {
        const headers = { 'Accept': 'application/vnd.github.v3+json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${GITHUB_FILE_PATH}?t=${Date.now()}`, { headers });
        if (res.ok) {
          const fileData = await res.json();
          const decoded = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
          tracks = JSON.parse(decoded);
          localStorage.setItem('local_tracks', JSON.stringify(tracks));
          renderTracks();
          return;
        }
      } catch (e) {}

      try {
        const res = await fetch(`./${GITHUB_FILE_PATH}?t=${Date.now()}`);
        if (res.ok) {
          tracks = await res.json();
          renderTracks();
        }
      } catch (e) {}
    }

    function renderTracks() {
      const container = document.getElementById('tracksGrid');
      container.innerHTML = '';

      if (tracks.length === 0) {
        container.innerHTML = `<div class="empty-state">Список пуст. Добавьте первый трек.</div>`;
        return;
      }

      tracks.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.innerHTML = `
          <div class="track-top">
            <span class="track-title">${track.title || 'Трек #' + (tracks.length - index)}</span>
            <button class="btn-delete" onclick="deleteTrack(${index})">Удалить</button>
          </div>
          <iframe src="${track.url}" height="${track.height || '352'}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        `;
        container.appendChild(card);
      });
    }

    function parseMediaInput(input) {
      input = input.trim();
      if (input.includes('<iframe')) {
        const match = input.match(/src=["']([^"']+)["']/);
        return match ? match[1] : null;
      }
      if (input.includes('open.spotify.com/')) {
        return input.replace('open.spotify.com/', 'open.spotify.com/embed/');
      }
      if (input.includes('youtube.com/watch?v=')) {
        const id = new URL(input).searchParams.get('v');
        return `https://www.youtube.com/embed/${id}`;
      }
      if (input.includes('youtu.be/')) {
        const id = input.split('youtu.be/')[1]?.split('?')[0];
        return `https://www.youtube.com/embed/${id}`;
      }
      return input;
    }

    async function addTrack() {
      const input = document.getElementById('embedInput').value;
      const title = document.getElementById('trackTitle').value;
      const url = parseMediaInput(input);

      if (!url) {
        alert('Введите корректную ссылку или iframe код');
        return;
      }

      const newTrack = {
        url: url,
        title: title || '',
        height: url.includes('spotify') ? '352' : (url.includes('youtube') ? '380' : '160')
      };

      tracks.unshift(newTrack);
      renderTracks();
      document.getElementById('embedInput').value = '';
      document.getElementById('trackTitle').value = '';
      closeModal('addModal');

      await syncWithGitHub();
    }

    async function deleteTrack(index) {
      if (!confirm('Удалить этот трек?')) return;
      tracks.splice(index, 1);
      renderTracks();
      await syncWithGitHub();
    }

    async function syncWithGitHub() {
      const repo = localStorage.getItem('gh_repo') || 'kalelikos/music-site';
      const token = localStorage.getItem('gh_token');

      localStorage.setItem('local_tracks', JSON.stringify(tracks));

      if (!token) {
        setStatus('Сохранено локально');
        return;
      }

      setStatus('Синхронизация...');

      try {
        const apiUrl = `https://api.github.com/repos/${repo}/contents/${GITHUB_FILE_PATH}`;
        const headers = {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        };

        let sha = null;
        const getRes = await fetch(apiUrl + `?t=${Date.now()}`, { headers });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        }

        const jsonStr = JSON.stringify(tracks, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(jsonStr)));

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify({
            message: 'Update tracks via kalel UI',
            content: base64Content,
            sha: sha || undefined
          })
        });

        if (putRes.ok) {
          setStatus('Сохранено на GitHub');
        } else {
          const err = await putRes.json();
          setStatus('Ошибка: ' + err.message, true);
        }
      } catch (e) {
        setStatus('Ошибка сети', true);
      }
    }
  </script>
</body>
</html>
